name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку/PR отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@v4

      # Та же мажорная версия Node, что и в nixpacks.toml (nodejs_24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build:web
