packages:
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - undici@6.27.0
  - undici@6.28.0
  - undici@6.28.1
  - postcss@8.5.23

overrides:
  # Держим undici в ветке 6.x: @discordjs/rest ломается на undici 7/8
  # (Headers из res.headers падает на Symbol(sensitiveHeaders)).
  # Верхняя граница <7 обязательна, чтобы резолв не ушёл на 7/8.
  undici@<6.28.1: ">=6.28.1 <7"
  baseline-browser-mapping@>=2.0.0 <2.11.0: ">=2.11.0"
  browserslist@<=4.28.6: ">=4.28.7"
  nanoid@<3.3.18: ">=3.3.18"
  postcss-selector-parser@<7.1.6: ">=7.1.6"
  proxy-addr@>=1.1.0 <2.0.8: ">=2.0.8"
  qs@<6.16.0: ">=6.16.0"
  source-map-js@>=1.0.0 <1.2.2: ">=1.2.2"
  uuid@<11.1.1: ">=11.1.1"
