packages:
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - undici@6.27.0
  - undici@6.28.0
  - undici@6.28.1
  - postcss@8.5.23

overrides:
  # Держим undici в ветке 6.x: @discordjs/rest ломается на undici 7/8
  # (Headers из res.headers падает на Symbol(sensitiveHeaders)).
  # Верхняя граница <7 обязательна, чтобы резолв не ушёл на 7/8.
  # Остальные override'ы тоже ограничены текущей мажорной версией:
  # без верхней границы pnpm ставит самую свежую (vite 8 с plugin-react 4 и т.п.).
  baseline-browser-mapping@>=2.0.0 <2.11.0: ">=2.11.0 <3"
  body-parser@<1.20.9: ">=1.20.9 <2"
  browserslist@<=4.28.6: ">=4.28.7 <5"
  nanoid@<3.3.18: ">=3.3.18 <4"
  # Патча для 6.x нет, поэтому tailwindcss@3 получает 7.x (сборка с ним работает).
  postcss-selector-parser@<7.1.6: ">=7.1.6 <8"
  proxy-addr@>=1.1.0 <2.0.8: ">=2.0.8 <3"
  qs@<6.16.1: ">=6.16.1 <7"
  source-map-js@>=1.0.0 <1.2.2: ">=1.2.2 <2"
  undici@<6.28.1: ">=6.28.1 <7"
  uuid@<11.1.1: ">=11.1.1 <12"
  vite@<=6.4.3: ">=6.4.4 <7"
  http-cache-semantics: ">=4.3.0 <5"
  minimatch@>=7.0.0 <11.0.1: ">=11.0.1 <12"
