packages:
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - uuid@11.1.1
  - undici@6.27.0
  - postcss@8.5.23
  - undici@6.28.0
overrides:
  # Держим undici в ветке 6.x: @discordjs/rest ломается на undici 7/8
  # (Headers из res.headers падает на Symbol(sensitiveHeaders)).
  # 6.28.0 — свежайшая 6.x и закрывает CVE, ради которой ставился override.
  baseline-browser-mapping@>=2.0.0 <2.11.0: '>=2.11.0'
  browserslist@<=4.28.6: '>=4.28.7'
  nanoid@<3.3.18: '>=3.3.18'
  qs@>=2.2.5 <6.16.0: '>=6.16.0'
  qs@>=6.14.2 <=6.15.3: '>=6.16.0'
  undici@<6.28.0: ">=6.28.0 <7"
  uuid@<11.1.1: ">=11.1.1"
